<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; letter-spacing: -4px; transform: translateY(6px); }
        100% { opacity: 1; letter-spacing: 2px; transform: translateY(0px); }
      }
      @keyframes underlineGrow {
        0% { stroke-dashoffset: 300; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="6" fill="url(#grad)" />
  <text x="50%" y="50%" text-anchor="middle"
        fill="#ffffff" font-size="52" font-family="Segoe UI, Roboto, sans-serif"
        style="opacity:0; animation: fadeIn 1.4s ease-out forwards;">
    A. Antony Benatict
  </text>

  <line x1="280" y1="110" x2="620" y2="110"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="400" stroke-dashoffset="400"
        style="animation: underlineGrow 1.2s ease-out 0.3s forwards;" />
</svg>
