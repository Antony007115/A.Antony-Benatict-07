<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

  <!-- Smooth gradient background (very subtle) -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <!-- Elegant fade-in animation -->
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; letter-spacing: -4px; }
        100% { opacity: 1; letter-spacing: 2px; }
      }
      @keyframes underlineGrow {
        0% { stroke-dashoffset: 300; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Text -->
  <text x="50%" y="50%" text-anchor="middle"
        fill="white" font-size="52" font-family="Segoe UI, Roboto, sans-serif"
        style="animation: fadeIn 1.8s ease-out forwards;">
    A. Antony Benatict
  </text>

  <!-- Underline -->
  <line x1="280" y1="100" x2="620" y2="100"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="300" stroke-dashoffset="300"
        style="animation: underlineGrow 1.6s ease-out 0.4s forwards;" />
</svg>
